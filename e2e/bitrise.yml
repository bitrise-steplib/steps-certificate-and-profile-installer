format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_certificate_profile_installer:
    envs:
    - BITRISE_CERTIFICATE_URL_LIST: $BITRISE_CERTIFICATE_URL_LIST
    - BITRISE_CERTIFICATE_PASSPHRASE_LIST: $BITRISE_CERTIFICATE_PASSPHRASE_LIST
    - BITRISE_PROVISIONING_PROFILE_URL_LIST: $BITRISE_PROVISIONING_PROFILE_URL_LIST
    - BITRISE_KEYCHAIN_PASSWORD: $BITRISE_KEYCHAIN_PASSWORD
    after_run:
    - _run

  test_certificate_url_and_passphrase_count_not_equal:
    steps:
    - script:
        title: Test if the step fails when the Certificate URL count is not equal to Certificate passphrase count
        inputs:
        - content: |-
            #!/bin/env bash
            set -x # Do not set -e as bitrise command is expected to fail
            bitrise run --config=./e2e/bitrise.yml utility_certificate_url_and_passphrase_count_not_equal
            if [ $? -ne 1 ] ; then
              echo "Workflow was excepted to fail, exit code not 1."
              exit 1
            fi

  utility_certificate_url_and_passphrase_count_not_equal:
    envs:
    - BITRISE_CERTIFICATE_URL_LIST: https://example.com|https://example.com|https://example.com
    - BITRISE_CERTIFICATE_PASSPHRASE_LIST: test|test|test|test
    - BITRISE_PROVISIONING_PROFILE_URL_LIST: $BITRISE_PROVISIONING_PROFILE_URL_LIST
    - BITRISE_KEYCHAIN_PASSWORD: $BITRISE_KEYCHAIN_PASSWORD
    after_run:
    - _run

  test_duplicated_certificates:
    description: |-
      Installs two self-signed certificates with the same common name, only the older one is included in the profile.
      Without deduplication both are installed, with deduplication only the one included in the profile.
    envs:
    - KEYCHAIN_PATH: $HOME/Library/Keychains/login.keychain
    - KEYCHAIN_PASSWORD: $BITRISE_KEYCHAIN_PASSWORD
    steps:
    - script:
        title: Generate certificates with the same name and a profile including the older one
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail

            DIR=$(mktemp -d)
            cd "$DIR"
            ID=$(uuidgen | tr -d - | cut -c1-10)
            CERT_NAME="Apple Development: E2E Dedup ($ID)"
            PROFILE_UUID=$(uuidgen)

            # Prints the SHA-1 fingerprint of the generated certificate
            gen_cert() {
              openssl req -x509 -newkey rsa:2048 -nodes -keyout "$1.key" -out "$1.pem" -days "$2" -set_serial "$3" \
                -subj "/UID=$ID/CN=$CERT_NAME/OU=$ID/O=E2E/C=US" 2>/dev/null
              openssl pkcs12 -export -inkey "$1.key" -in "$1.pem" -out "$1.p12" -passout pass:e2e \
                -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
              openssl x509 -in "$1.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :
            }
            IN_PROFILE_SHA1=$(gen_cert in_profile 30 1001)
            NOT_IN_PROFILE_SHA1=$(gen_cert not_in_profile 60 1002)

            cat > profile.plist <<PLIST
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>Name</key><string>E2E Dedup $ID</string>
              <key>UUID</key><string>$PROFILE_UUID</string>
              <key>Platform</key><array><string>iOS</string></array>
              <key>TeamIdentifier</key><array><string>$ID</string></array>
              <key>TeamName</key><string>E2E</string>
              <key>ExpirationDate</key><date>$(date -u -v+30d +%Y-%m-%dT%H:%M:%SZ)</date>
              <key>Entitlements</key><dict><key>application-identifier</key><string>$ID.*</string></dict>
              <key>DeveloperCertificates</key><array><data>$(openssl x509 -in in_profile.pem -outform DER | base64)</data></array>
            </dict>
            </plist>
            PLIST
            openssl smime -sign -signer in_profile.pem -inkey in_profile.key -in profile.plist \
              -outform DER -nodetach -binary -out profile.mobileprovision

            envman add --key DUP_CERT_NAME --value "$CERT_NAME"
            envman add --key DUP_IN_PROFILE_SHA1 --value "$IN_PROFILE_SHA1"
            envman add --key DUP_NOT_IN_PROFILE_SHA1 --value "$NOT_IN_PROFILE_SHA1"
            envman add --key DUP_PROFILE_PATH --value "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            envman add --key DUP_CERTIFICATE_URLS --value "file://$DIR/in_profile.p12|file://$DIR/not_in_profile.p12"
            envman add --key DUP_PROFILE_URL --value "file://$DIR/profile.mobileprovision"
    - path::./:
        title: Install without deduplication
        inputs:
        - certificate_url: $DUP_CERTIFICATE_URLS
        - certificate_passphrase: e2e|e2e
        - provisioning_profile_url: $DUP_PROFILE_URL
        - install_defaults: "no"
        - keychain_path: $KEYCHAIN_PATH
        - keychain_password: $KEYCHAIN_PASSWORD
        - deduplicate_certificates: "false"
    - script:
        title: Check both certificates are installed
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail

            installed=$(security find-certificate -a -c "$DUP_CERT_NAME" -Z "$KEYCHAIN_PATH" | grep "SHA-1 hash:" || true)
            echo "$installed"
            grep -q "$DUP_IN_PROFILE_SHA1" <<< "$installed" || { echo "Certificate included in the profile is not installed"; exit 1; }
            grep -q "$DUP_NOT_IN_PROFILE_SHA1" <<< "$installed" || { echo "Certificate not included in the profile is not installed"; exit 1; }

            security delete-identity -Z "$DUP_IN_PROFILE_SHA1" "$KEYCHAIN_PATH"
            security delete-identity -Z "$DUP_NOT_IN_PROFILE_SHA1" "$KEYCHAIN_PATH"
    - path::./:
        title: Install with deduplication
        inputs:
        - certificate_url: $DUP_CERTIFICATE_URLS
        - certificate_passphrase: e2e|e2e
        - provisioning_profile_url: $DUP_PROFILE_URL
        - install_defaults: "no"
        - keychain_path: $KEYCHAIN_PATH
        - keychain_password: $KEYCHAIN_PASSWORD
        - deduplicate_certificates: "true"
    - script:
        title: Check only the certificate included in the profile is installed
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail

            installed=$(security find-certificate -a -c "$DUP_CERT_NAME" -Z "$KEYCHAIN_PATH" | grep "SHA-1 hash:" || true)
            echo "$installed"
            grep -q "$DUP_IN_PROFILE_SHA1" <<< "$installed" || { echo "Certificate included in the profile is not installed"; exit 1; }
            if grep -q "$DUP_NOT_IN_PROFILE_SHA1" <<< "$installed"; then
              echo "Certificate not included in the profile is installed"
              exit 1
            fi
    - script:
        title: Clean up installed certificates and profile
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -x

            for sha1 in "$DUP_IN_PROFILE_SHA1" "$DUP_NOT_IN_PROFILE_SHA1"; do
              [ -n "$sha1" ] && security delete-identity -Z "$sha1" "$KEYCHAIN_PATH"
            done
            [ -n "$DUP_PROFILE_PATH" ] && rm -f "$DUP_PROFILE_PATH"
            exit 0

  _run:
    steps:
    - change-workdir:
        title: Switch working dir to test / _tmp dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file' in the step's code, which would
          work for testing the step from this directory directly
          but would break if the step is included in another `bitrise.yml`.
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - path::./:
        inputs:
        - certificate_url: $BITRISE_CERTIFICATE_URL_LIST
        - certificate_passphrase: $BITRISE_CERTIFICATE_PASSPHRASE_LIST
        - provisioning_profile_url: $BITRISE_PROVISIONING_PROFILE_URL_LIST
        - keychain_path: $HOME/Library/Keychains/login.keychain
        - keychain_password: $BITRISE_KEYCHAIN_PASSWORD
